name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APKs and App Bundle
        run: |
          mkdir -p dist/creative-camera-android
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/creative-camera-android/creative-camera-universal.apk
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/creative-camera-android/
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab dist/creative-camera-android/creative-camera.aab
      - name: Package Android zip
        run: |
          cd dist && zip -qr creative-camera-android.zip creative-camera-android
      - uses: actions/upload-artifact@v4
        with:
          name: creative-camera-android
          path: dist/creative-camera-android.zip

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr creative-camera-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: creative-camera-unsigned.ipa
